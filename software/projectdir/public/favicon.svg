<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PROJECTdir">
  <!--
    One canonical part, many suppliers. The node on the left is the part;
    the four on the right are the shops that stock it. The mark is the product
    thesis, not a letterform, so it still reads at 16px.
    Grid echoes the blueprint/technical direction of the site.
  -->
  <defs>
    <pattern id="g" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" fill="none" stroke="#1B4D8F" stroke-width="0.5" opacity="0.28" />
    </pattern>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0F1419" />
  <rect width="32" height="32" rx="6" fill="url(#g)" />

  <!-- connectors: one part fanning out to suppliers -->
  <g stroke="#F2A03D" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
    <path d="M10 16h4" />
    <path d="M14 16c3.4 0 3.2-6 6.2-6" />
    <path d="M14 16h6.2" />
    <path d="M14 16c3.4 0 3.2 6 6.2 6" />
  </g>

  <!-- the canonical part -->
  <circle cx="9" cy="16" r="3.6" fill="#F2A03D" />

  <!-- the suppliers -->
  <g fill="#F6F4EF">
    <circle cx="21.5" cy="10" r="1.9" />
    <circle cx="21.5" cy="16" r="1.9" />
    <circle cx="21.5" cy="22" r="1.9" />
  </g>
</svg>
